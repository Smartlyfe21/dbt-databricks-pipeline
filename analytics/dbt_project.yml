name: analytics

profile: databricks

clean-targets:
  - "target"
  - "dbt_packages"

#configuration models
#Full documentation: https://docs.getdbt.com/docs/configuration-models

#In this example config, we tell dbt to build all models in the example/
#directory as views. These settings can be overridden in the individual
#files using the '{{ config(...) }}' macro.

models:
  analytics:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
